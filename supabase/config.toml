# =============================================================================
# Supabase CLI configuration — SZMC Alumni
# Used by: supabase link / supabase db push / supabase functions deploy
# Docs: https://supabase.com/docs/guides/local-development/cli/config
# =============================================================================

project_id = "szmc-alumni"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://ndcbogura.alumniworld.xyz"
additional_redirect_urls = [
  "https://ndcbogura.alumniworld.xyz",
  "https://alumniworld.xyz",
  "https://www.alumniworld.xyz",
  "http://localhost:3000",
  "http://localhost:5173",
  "http://127.0.0.1:3000"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Set to false in the dashboard if you want members to log in right after signup.
enable_confirmations = false

[auth.external.google]
enabled = true
skip_nonce_check = false

[storage]
enabled = true
file_size_limit = "20MiB"

# -----------------------------------------------------------------------------
# EDGE FUNCTIONS
# verify_jwt = false is required for the two public endpoints (they validate the
# caller themselves / must accept pre-login requests).
# -----------------------------------------------------------------------------
[functions.unified-phone-login]
verify_jwt = false

[functions.admin-verify-phone]
verify_jwt = true

[functions.admin-hub]
verify_jwt = true

[functions.unfurl]
verify_jwt = false

[analytics]
enabled = false
